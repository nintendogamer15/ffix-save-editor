name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - run: ./scripts/check-submodule.sh
      - run: ./scripts/check-workflows.sh
      # actions/setup-dotnet v5.0.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore FFIX.SaveEditor.slnx --locked-mode
      - run: dotnet build FFIX.SaveEditor.slnx --configuration Release --no-restore
      - run: dotnet test FFIX.SaveEditor.slnx --configuration Release --no-build
