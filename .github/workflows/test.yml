name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore FFIX.SaveEditor.slnx
      - run: dotnet build FFIX.SaveEditor.slnx --configuration Release --no-restore
      - run: dotnet test FFIX.SaveEditor.slnx --configuration Release --no-build
