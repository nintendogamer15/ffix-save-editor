name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push --tags`) to build the
# portable Windows exe (on a real windows-latest runner - no Wine/cross-
# compilation involved) and the Linux AppImage, package a source zip, and
# publish all three as assets on a new GitHub Release for that tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install pyinstaller pycryptodome pyside6-essentials
      - name: Build FFIXSaveEditor.exe
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean FFIXSaveEditor.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/FFIXSaveEditor.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        working-directory: linux
        run: |
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: linux/FFIXSaveEditor-x86_64.AppImage
          if-no-files-found: error

  build-source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source as a zip
        run: git archive --format=zip -o ffix-save-editor-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: ffix-save-editor-source.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-source-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename assets to include the version
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p out
          cp "artifacts/windows-exe/FFIXSaveEditor.exe" "out/FFIXSaveEditor-${version}-windows.exe"
          cp "artifacts/linux-appimage/FFIXSaveEditor-x86_64.AppImage" "out/FFIXSaveEditor-${version}-linux-x86_64.AppImage"
          cp "artifacts/source-zip/ffix-save-editor-source.zip" "out/ffix-save-editor-${version}-source.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
