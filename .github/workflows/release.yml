name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore FFIX.SaveEditor.slnx
      - name: Test
        run: dotnet test FFIX.SaveEditor.slnx --configuration Release --no-restore
      - name: Publish Windows and Linux from Linux
        env:
          RELEASE_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
        run: ./scripts/build-release.sh "$RELEASE_LABEL" "$RUNNER_TEMP/release"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFIXSaveEditor-build-${{ github.run_number }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release/*
          generate_release_notes: true
